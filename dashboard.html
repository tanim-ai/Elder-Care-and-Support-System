<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Guardian Dashboard</title>
        <link rel="stylesheet" href="css/navbar.css">
        <link rel="stylesheet" href="css/mainBody.css">
    </head>
    <body>
        <div id="sidebar"></div>

        <div class="main-body">
            <div class="dashboard-wrapper">

                <div class="content-header">
                    <div>
                        <h1>Resident Overview</h1>
                        <p id="vitals-last-updated">--</p>
                    </div>
                    <div>
                        <a href="accommodation.html"><button class="btn-outline">Upgrade Accommodation</button></a>
                        <a href="medicalCare.html"><button class="btn-solid">Manage Medical Care</button></a>
                    </div>
                </div>

                <div class="main-grid">
                    <div class="left-column">
                        <div class="cards-row">
                            <div class="card">
                                <div class="card-header">
                                    <span class="card-tag" id="bp-status">--</span>
                                </div>
                                <div class="card-body">
                                    <p class="card-label">Blood Pressure</p>
                                    <div class="card-value">
                                        <span class="card-number" id="bp-value">--</span>
                                        <span class="card-unit">mmHg</span>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <span class="card-tag" id="hr-status">--</span>
                                </div>
                                <div class="card-body">
                                    <p class="card-label">Heart Rate</p>
                                    <div class="card-value">
                                        <span class="card-number" id="hr-value">--</span>
                                        <span class="card-unit">per minute</span>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <span class="card-tag" id="sugar-status">--</span>
                                </div>
                                <div class="card-body">
                                    <p class="card-label">Blood Sugar</p>
                                    <div class="card-value">
                                        <span class="card-number" id="sugar-value">--</span>
                                         <span class="card-unit" id="sugar-unit"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="daily-medication-card">
                            <div class="daily-medication-header">
                                <span class="daily-medication-title">Daily Medication</span>
                                <span class="daily-medication-progress">-- of -- doses taken</span>
                            </div>
                            <div class="daily-medication-body">
                                <p>Loading...</p>
                            </div>
                        </div>

                    </div>

                    <div class="right-column">
                        <div class="activity-feed-card">
                            <div class="activity-feed-header">
                                <span class="activity-feed-title">🔔 Activity Feed</span>
                            </div>
                            <div class="activity-list">
                                <p>Loading...</p>
                            </div>
                            <a href="activityFeed.html"><button class="view-history-btn">View Schedule Details</button></a>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <script src="js/sidebar.js"></script>
        <script src="js/vitals.js"></script>
        <script src="js/medication.js"></script>
        <script src="js/activity.js"></script>
    </body>
</html>
