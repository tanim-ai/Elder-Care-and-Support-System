<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>History</title>
        <link rel="stylesheet" href="css/navbar.css">
        <link rel="stylesheet" href="css/billing.css">
    </head>
    <body>
        <div id="sidebar"></div>
        <div class="app">
            <main class="main">

                <header class="page-header">
                    <div>
                        <h1>Payment History</h1>
                        <p class="subtitle" id="subtitle">Full record of past invoices and payments.</p>
                    </div>
                    <a href="billing.html" class="btn btn-secondary">← Back to Billing</a>
                </header>

                <section class="card history-card full-history">
                    <ul class="history-list" id="historyList">
                        <li><div class="history-details"><div class="history-month">Loading…</div></div></li>
                    </ul>
                </section>

            </main>
        </div>

        <script src="js/sidebar.js"></script>
        <script>
            const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
                ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
            const money = (v) => Number(v).toLocaleString("en-US", { style: "currency", currency: "USD" });
            const msg = (t) => `<li><div class="history-details"><div class="history-month">${esc(t)}</div></div></li>`;

            (async () => {
                const list = document.getElementById("historyList");
                try {
                    const res = await fetch("PHP/get_billing.php?all=1", { credentials: "same-origin" });
                    const data = await res.json();
                    if (!data.success) { list.innerHTML = msg(data.message || "Could not load payment history."); return; }

                    document.getElementById("subtitle").textContent =
                        `Full record of past invoices and payments for ${data.resident.name}.`;

                    list.innerHTML = data.history.length ? data.history.map((p) => {
                        const month = new Date(p.billing_month + "T00:00:00")
                            .toLocaleString("en-US", { month: "long", year: "numeric" });
                        return `
                        <li>
                            <span class="check">✔</span>
                            <div class="history-details">
                                <div class="history-month">${esc(month)} Invoice</div>
                                <div class="history-date">Paid on ${esc(p.paid_on)} · ${esc(p.method)}</div>
                            </div>
                            <div class="history-amount">${money(p.amount)}</div>
                        </li>`;
                    }).join("") : msg("No payments yet.");
                } catch (e) {
                    list.innerHTML = msg("Could not load payment history. Please check your connection.");
                }
            })();
        </script>
    </body>
</html>
